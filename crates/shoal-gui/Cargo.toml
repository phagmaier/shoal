[package]
name = "shoal-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Wayland graphical terminal window for Shoal"

[[bin]]
name = "shoal-gui"
path = "src/main.rs"

[dependencies]
futures = { version = "0.3.34", default-features = false, features = ["std"] }
gpui.workspace = true
gpui_platform.workspace = true
shoal-client.workspace = true
shoal-config.workspace = true
shoal-model.workspace = true
shoal-term.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }

[dev-dependencies]
shoal-testkit.workspace = true
