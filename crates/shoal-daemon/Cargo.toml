[package]
name = "shoal-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Session daemon for Shoal"

# The library holds what integration tests drive directly; nothing else may
# depend on it (deny.toml).
[lib]
path = "src/lib.rs"

[[bin]]
name = "shoald"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
zstd = { version = "0.13.3", default-features = false }
shoal-config.workspace = true
shoal-model.workspace = true
shoal-proto.workspace = true
shoal-term = { path = "../shoal-term" }
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo"] }
portable-pty.workspace = true
rustix = { workspace = true, features = ["event", "fs", "process"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "time", "sync"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "registry", "std"] }

[dev-dependencies]
insta.workspace = true
shoal-testkit = { path = "../shoal-testkit" }
tempfile.workspace = true
