# Literal defaults from M1 spec §9.1; an independent oracle for optional fields.
[font]
family = "JetBrains Mono"
size = 10.0
line_height = 1.4
[window]
opacity = 0.88
padding = 8
gap = 6
radius = 10
[theme]
source = "omarchy"
[theme.colors]
[cursor]
style = "block"
blink = false
color = "accent"
[scrollback]
lines = 10000
persist = true
[shell]
program = ""
integration = "auto"
[prompt]
mode = "native"
style = "powerline"
segments = ["user", "path", "git", "runtime"]
[selection]
copy_on_select = false
[tabs]
title = "auto"
[behavior]
close_pane_on_exit = true
confirm_close_running = true
[keybinds]
